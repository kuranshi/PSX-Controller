name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows_gamepad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: .\build.ps1
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem .\dist\installer\PSX-Controller-Setup-*-x64.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer executable was not produced.' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName --generate-notes
      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: PSX-Controller-Windows-x64
          path: windows_gamepad/dist/installer/*.exe
